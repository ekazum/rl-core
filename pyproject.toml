[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-core"
version = "0.3.1"
description = "Reinforcement learning parts for threaded training pipelines: replay threads, Q inference, checkpoints, PPO"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "torch",
    "ai-runtime @ git+https://github.com/ekazum/ai-runtime.git@v0.3.1",
]
authors = [{ name = "Eli Kazum", email = "ekazum@gmail.com" }]
keywords = ["machine-learning", "reinforcement-learning", "ppo", "dqn", "replay-buffer", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
examples = ["gymnasium"]

[project.urls]
Homepage = "https://github.com/ekazum/rl-core"
Repository = "https://github.com/ekazum/rl-core"
Issues = "https://github.com/ekazum/rl-core/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rl_core*"]
